[package]
authors = ["Navid <yaa110@gmail.com>"]
categories = ["asynchronous", "network-programming"]
description = "Asynchronous allocation of TUN/TAP devices using tokio"
documentation = "https://docs.rs/tokio-tun"
edition = "2024"
homepage = "https://github.com/yaa110/tokio-tun"
keywords = ["tun", "tap", "async", "tokio"]
license = "MIT OR Apache-2.0"
name = "tokio-tun"
readme = "README.md"
repository = "https://github.com/yaa110/tokio-tun"
version = "0.21.0"

[dependencies]
libc = "0.2"
# Caret requirement: >=1.54, <2.0. Users may select any compatible 1.x release.
tokio = {version = "1.54", features = ["net"]}

[dev-dependencies]
tokio = {version = "1.54", features = ["full"]}

[[example]]
name = "android-bridge"
path = "examples/android/tun_bridge.rs"

[[example]]
name = "ios-bridge"
path = "examples/ios/tun_bridge.rs"
