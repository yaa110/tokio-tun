name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: test and build
        uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
      - run: cargo test
      - run: cargo fmt -- --check
      - run: cargo clippy
      - run: cargo build
